plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystoreProps.containsKey("storeFile")
def rawPin = (project.findProperty("BUILD_PIN") ?: "240994").toString()
def pinBytes = rawPin.getBytes("UTF-8")
def xorKey = 0x57
def maskedBytes = pinBytes.collect { (it ^ xorKey) as int }
def maskedPinArrayStr = "{" + maskedBytes.join(",") + "}"

def rawDomain = "rammbox.duckdns.org"
def domainBytes = rawDomain.getBytes("UTF-8")
def maskedDomainBytes = domainBytes.collect { (it ^ xorKey) as int }
def maskedDomainArrayStr = "{" + maskedDomainBytes.join(",") + "}"

android {
    namespace 'com.rambox.mirror'
    compileSdk 34

    defaultConfig {
        applicationId "com.rambox.mirror"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "2.20"
        
        buildConfigField "int[]", "MASKED_PIN", "new int[]" + maskedPinArrayStr
        buildConfigField "int[]", "MASKED_DOMAIN", "new int[]" + maskedDomainArrayStr
        buildConfigField "int", "MASK_KEY", "${xorKey}"
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreProps["storeFile"].toString())
                storePassword keystoreProps["storePassword"].toString()
                keyAlias keystoreProps["keyAlias"].toString()
                keyPassword keystoreProps["keyPassword"].toString()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // WebSocket Dependencies
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'

    // SQLCipher
    implementation 'net.zetetic:sqlcipher-android:4.6.1@aar'
    implementation 'androidx.sqlite:sqlite:2.4.0'
}
